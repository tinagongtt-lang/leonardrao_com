services:
  db:
    image: postgres:16
    container_name: leonardrao-db
    environment:
      POSTGRES_DB: ${DB_NAME:-leonardrao}
      POSTGRES_USER: ${DB_USER:-leonard}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
